# A drawn floor plan: rooms are rectangles in metres (x to the east, z to the south).
# Link each room to a Home Assistant area and its lights, sensors, doors and climate are found automatically.
type: custom:sweet-home-card
title: Our Flat
house:
  auto_furniture: true          # beds, sofas, tables… picked from the room names
  rooms:
    - area: living_room
      rects: [[0, 0, 6, 5]]
      light_fx:                 # how a light is drawn in 3D: center | spots | strip | tv
        light.living_room_ceiling: center
        light.living_room_led: strip
      strip_sides: nes          # LED strip on the north, east and south walls
    - area: kitchen
      rects: [[6, 0, 10, 4]]
    - area: hallway
      rects: [[6, 4, 10, 5.5]]
    - area: bedroom
      rects: [[0, 5, 5, 9]]
      climate: climate.bedroom_ac   # override what was discovered
    - area: bathroom
      rects: [[5, 5.5, 7.5, 9]]
    - name: Balcony
      rects: [[7.5, 5.5, 10, 9]]
      outdoor: true
  # Rooms are closed by walls: add a door or an opening wherever you can walk through.
  openings:                     # open passages (no wall, no door)
    - [6, 4, 6, 5]
    - [7, 4, 9, 4]
  doors:                        # doors cut their own gap; with a contact sensor they swing open in 3D
    - entity: binary_sensor.front_door_contact
      from: [8, 5.5]
      to: [9, 5.5]
      main: true
    - { from: [2, 5], to: [3, 5] }          # living room ↔ bedroom (no sensor: a closed door)
    - { from: [5, 6.5], to: [5, 7.4] }      # bedroom ↔ bathroom
    - { from: [7.5, 6.5], to: [7.5, 7.4] }  # bathroom ↔ balcony
  lock_badges:
    - lock: lock.front_door
      x: 9.2
      z: 5.4
