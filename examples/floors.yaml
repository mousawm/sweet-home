# Two floors: rooms (and doors, windows, badges) carry `level`. The 3D view gets floor buttons.
# Without `rooms`, the house built from your areas already has one floor per Home Assistant floor.
type: custom:sweet-home-card
house:
  levels:                        # optional names (default: your Home Assistant floor names)
    - { level: 0, name: Downstairs }
    - { level: 1, name: Upstairs }
  rooms:
    - { area: living_room, rects: [[0, 0, 6, 5]] }
    - { area: kitchen, rects: [[6, 0, 10, 5]] }
    - { name: Stairs, rects: [[10, 0, 12, 5]] }          # named "Stairs": a flight of stairs is drawn
    - { area: bedroom, level: 1, rects: [[0, 0, 6, 5]] }
    - { area: office, level: 1, rects: [[6, 0, 10, 5]] }
    - { name: Landing, level: 1, stairs: true, rects: [[10, 0, 12, 5]] }   # on an upper floor the stairs go down
  doors:
    - { from: [6, 2], to: [6, 3] }                       # ground floor
    - { from: [10, 2], to: [10, 3] }
    - { from: [6, 2], to: [6, 3], level: 1 }             # first floor
    - { from: [10, 2], to: [10, 3], level: 1 }
