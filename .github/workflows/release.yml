name: Release
# Publishes a release for the version in package.json (v<version>, with dist/sweet-home-card.js attached)
# whenever main is pushed and that release doesn't exist yet. Bump "version" in package.json to release.
# A version with a suffix (0.7.0-beta.1, 0.7.0-rc.1) is published as a pre-release: the latest stable release stays
# the one the Marketplace installs, and only people who turn on "Show beta versions" get it. Pushing a tag v<version>
# from any branch publishes that commit (use it for a beta that is not on main yet).
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Publish the release with the card file
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/sweet-home-card.js --clobber
          else
            case "$TAG" in
              *-*) gh release create "$TAG" dist/sweet-home-card.js --target "$GITHUB_SHA" --title "Sweet Home $TAG (beta)" --generate-notes --prerelease --latest=false ;;
              *) gh release create "$TAG" dist/sweet-home-card.js --target "$GITHUB_SHA" --title "Sweet Home $TAG" --generate-notes ;;
            esac
          fi
