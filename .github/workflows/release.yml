name: Release
# Publishes a release for the version in package.json (v<version>, with dist/sweet-home-card.js and
# dist/sweet-home-editor.js attached: HACS installs every file of the release)
# only when main is pushed with a version that has no release yet. Pushes without a version bump do nothing,
# so fixes collect under "Unreleased" in CHANGELOG.md until a release is cut (see CLAUDE.md).
# The release notes are that version's section of CHANGELOG.md.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Publish the release with the card file
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG is already released; nothing to do (bump the version to release)."
            exit 0
          fi
          awk -v tag="$TAG" '
            /^## / { if (found) exit; if (index($0, "## " tag " ") == 1 || $0 == "## " tag) { found = 1; next } }
            found && !/^### *$/ { print }
          ' CHANGELOG.md > notes.md
          if [ -s notes.md ] && grep -q '[^[:space:]]' notes.md; then
            gh release create "$TAG" dist/sweet-home-card.js dist/sweet-home-editor.js --target "$GITHUB_SHA" --title "Sweet Home $TAG" --notes-file notes.md
          else
            gh release create "$TAG" dist/sweet-home-card.js dist/sweet-home-editor.js --target "$GITHUB_SHA" --title "Sweet Home $TAG" --generate-notes
          fi
